<svg viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e4dccb"/>
    </linearGradient>
  </defs>

  <!-- tail -->
  <path d="M300 300 C 370 300 385 380 340 410 C 310 430 280 415 285 390 C 288 372 305 368 300 350"
        fill="none" stroke="#c9b896" stroke-width="34" stroke-linecap="round"/>
  <path d="M300 300 C 370 300 385 380 340 410 C 310 430 280 415 285 390 C 288 372 305 368 300 350"
        fill="none" stroke="#8a7350" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.5"/>

  <!-- back legs -->
  <ellipse cx="150" cy="430" rx="30" ry="20" fill="#e4dccb"/>
  <ellipse cx="250" cy="430" rx="30" ry="20" fill="#e4dccb"/>

  <!-- body -->
  <ellipse cx="200" cy="340" rx="105" ry="90" fill="url(#bodyGrad)"/>

  <!-- jersey (generic sporty top, no real logos) -->
  <path d="M120 290 Q200 250 280 290 L268 380 Q200 400 132 380 Z" fill="#2f4fb3"/>
  <path d="M120 290 Q200 250 280 290 L268 340 Q200 360 132 340 Z" fill="#243f96"/>
  <path d="M170 260 L200 285 L230 260 L215 250 Q200 262 185 250 Z" fill="#ffffff"/>
  <circle cx="200" cy="330" r="20" fill="#ffffff" opacity="0.9"/>
  <path d="M190 322 l7 7 l13 -14" stroke="#2f4fb3" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right arm pointing up-left -->
  <path d="M150 300 C 90 270 60 210 45 160" stroke="#f5f0e8" stroke-width="34" stroke-linecap="round" fill="none"/>
  <circle cx="42" cy="150" r="22" fill="#f5f0e8"/>
  <path d="M32 140 L26 118 M42 132 L40 108 M52 134 L54 112" stroke="#f5f0e8" stroke-width="12" stroke-linecap="round"/>

  <!-- left arm resting -->
  <path d="M270 320 C 300 340 310 365 300 385" stroke="#e4dccb" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- head -->
  <circle cx="200" cy="180" r="112" fill="url(#bodyGrad)"/>

  <!-- ears -->
  <path d="M110 120 L95 40 L165 95 Z" fill="#f5f0e8"/>
  <path d="M118 108 L110 60 L150 92 Z" fill="#d8a9b0"/>
  <path d="M290 120 L305 40 L235 95 Z" fill="#c9b896"/>
  <path d="M282 108 L290 60 L250 92 Z" fill="#d8a9b0"/>

  <!-- head stripes -->
  <path d="M150 75 L140 40" stroke="#8a7350" stroke-width="10" stroke-linecap="round"/>
  <path d="M180 65 L175 32" stroke="#8a7350" stroke-width="10" stroke-linecap="round"/>
  <path d="M240 90 Q290 130 290 180" stroke="#c9b896" stroke-width="55" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- face -->
  <ellipse cx="200" cy="205" rx="60" ry="46" fill="#fbf8f2"/>

  <!-- eyes (sleepy/confident, matching reference pose) -->
  <path d="M150 175 Q168 168 186 176" stroke="#3a3226" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M214 176 Q232 168 250 175" stroke="#3a3226" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- nose + mouth -->
  <ellipse cx="200" cy="210" rx="12" ry="9" fill="#f2a7c0"/>
  <path d="M200 219 L200 230" stroke="#3a3226" stroke-width="4" stroke-linecap="round"/>
  <path d="M200 230 Q182 244 166 232" stroke="#3a3226" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M200 230 Q218 244 234 232" stroke="#3a3226" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- whiskers -->
  <path d="M120 205 L60 198 M120 218 L58 220 M280 205 L340 198 M280 218 L342 220" stroke="#c9b896" stroke-width="4" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="150" cy="215" rx="14" ry="8" fill="#f2a7c0" opacity="0.55"/>
  <ellipse cx="250" cy="215" rx="14" ry="8" fill="#f2a7c0" opacity="0.55"/>
</svg>
